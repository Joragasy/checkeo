[project]
name = "checkeo"
version = "0.1.0"
description = "Profil statistique d'un trajet ferroviaire domicile-travail (open data SNCF)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "holidays>=0.58",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checkeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
